name: Publish Post

on:
  workflow_dispatch:
    inputs:
      post_slug:
        description: "Post folder below blog/posts. Leave empty only for full render."
        required: false
      full_render:
        description: "Render the complete site"
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: sofacycling-content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests staticmap pillow

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::knitr
            any::rmarkdown
            any::jsonlite
            any::fs

      - name: Verify R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("knitr", "rmarkdown", "jsonlite", "fs")
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) stop("Missing R packages: ", paste(missing, collapse = ", "))

      - name: Synchronize selected post
        if: ${{ inputs.full_render != 'true' }}
        shell: bash
        run: |
          post_slug="${{ inputs.post_slug }}"

          if [[ -z "$post_slug" ]]; then
            echo "post_slug is required unless full_render is true"
            exit 1
          fi

          python scripts/create_post.py --sync-post "$post_slug"

      - name: Render site or selected post
        shell: bash
        run: |
          if [[ "${{ inputs.full_render }}" == "true" ]]; then
            quarto render
            exit 0
          fi

          post_slug="${{ inputs.post_slug }}"

          if [[ -z "$post_slug" ]]; then
            echo "post_slug is required unless full_render is true"
            exit 1
          fi

          post_file="blog/posts/${post_slug}/index.qmd"

          if [[ ! -f "$post_file" ]]; then
            echo "Post file not found: $post_file"
            exit 1
          fi

          quarto render "$post_file"
          quarto render blog/index.qmd
          quarto render admin/index.qmd

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts/ docs/
          git diff --cached --quiet || git commit -m "Publish new post"
          git push

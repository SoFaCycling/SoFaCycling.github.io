name: Publish Post

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set R library path
        run: echo "R_LIBS_USER=~/R/library" >> $GITHUB_ENV

      - name: Install R dependencies
        run: |
          Rscript -e 'dir.create(Sys.getenv("R_LIBS_USER"), recursive=TRUE, showWarnings=FALSE)'
          Rscript -e 'install.packages(c("knitr","rmarkdown","jsonlite"), repos="https://cloud.r-project.org", lib=Sys.getenv("R_LIBS_USER"))'

      - name: Verify R packages
        run: |
          Rscript -e 'library(knitr); library(rmarkdown); library(jsonlite)'

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Publish new post"
          git push